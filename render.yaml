# Render Blueprint: free web service for tigermaxjobs.com
services:
  - type: web
    name: tigermaxjobs
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /privacy
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: AUTO_APPLY_MIN_SCORE
        value: "65"
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        value: apply.tigermaxjobs.com
      - key: MAILGUN_API_BASE
        value: https://api.mailgun.net
      - key: MAILGUN_WEBHOOK_SIGNING_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
